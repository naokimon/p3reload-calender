<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P3Reload - Calender</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="src/favicon.ico" type="image/x-icon">
</head>
<body>
    <video autoplay muted loop class="background">
        <source src="src/background.mp4" type="video/mp4">
    </video>
    <main class="calender">
        <header class="header">
            <span class="button">Q</span>
            <span id="month-year">January 2026</span>
            <span class="button">E</span>
        </header>
        <ol class="weekdays">
            <li>SUN</li>
            <li>MON</li>
            <li>TUE</li>
            <li>WED</li>
            <li>THU</li>
            <li>FRI</li>
            <li>SAT</li>
        </ol>
        <ol class="days" id="days">
        </ol>
    </main>
    <script src="js/main.js" defer></script>
</body>
</html>
